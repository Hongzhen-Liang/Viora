# micro-wake-word training configuration (mirrors the official
# basic_training_notebook, adjusted for the local Hi Vesper dataset).
# Paths are relative to the mww workspace root (wake_word_training/mww).
window_step_ms: 10
train_dir: "trained_models/wakeword"

# Positive: our Piper-generated "Hi Vesper" augmented features.
# Negatives: pre-generated HuggingFace feature sets (speech, dinner party,
# no-speech) plus the dinner_party_eval set for validation/testing_ambient.
features:
  - features_dir: "data/generated_augmented_features"
    sampling_weight: 2.0
    penalty_weight: 1.0
    truth: true
    truncation_strategy: "truncate_start"
    type: "mmap"
  - features_dir: "data/generated_negative_features"
    sampling_weight: 12.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: "random"
    type: "mmap"
  - features_dir: "data/negative_datasets/speech"
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: "random"
    type: "mmap"
  - features_dir: "data/negative_datasets/dinner_party"
    sampling_weight: 10.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: "random"
    type: "mmap"
  - features_dir: "data/negative_datasets/no_speech"
    sampling_weight: 5.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: "random"
    type: "mmap"
  - features_dir: "data/negative_datasets/dinner_party_eval"
    sampling_weight: 0.0
    penalty_weight: 1.0
    truth: false
    truncation_strategy: "split"
    type: "mmap"

training_steps: [10000]
positive_class_weight: [1]
negative_class_weight: [40]
learning_rates: [0.001]
batch_size: 128
# Mild SpecAugment to reduce overfitting on the clean TTS positives.
time_mask_max_size: [50]
time_mask_count: [2]
freq_mask_max_size: [5]
freq_mask_count: [2]
eval_step_interval: 500
clip_duration_ms: 1500
target_minimization: 0.9
minimization_metric: null
maximization_metric: "average_viable_recall"
