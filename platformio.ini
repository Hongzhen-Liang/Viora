; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:rymcu-esp32-s3-devkitc-1]
platform = espressif32
; 自定义板卡：实际是 N16R8（16MB Flash / 8MB 八线 PSRAM），qio_opi 启用 OPI PSRAM
board = rymcu-esp32-s3-n16r8
framework = arduino
monitor_speed = 115200
; 固件上传波特率提到 921600（ESP32-S3 原生 USB 支持），加快上传
upload_speed = 921600
board_build.partitions = partitions.csv
; 加大 loopTask 栈（loop() 里有多个大数组，默认 8KB 会栈溢出触发 canary panic）
build_unflags = -fexceptions
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384
    -fno-exceptions
; ESP-SR 负责 VAD/降噪；官方 TFLite Micro 运行自研 Hi Vesper INT8 模型
extra_scripts = pre:scripts/esp_sr_build.py
; WebSocket 客户端（连接 Mac 服务器上传/接收音频）
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.0.4
