; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:waveshare-esp32-s3-rlcd-42]
platform = espressif32
; Waveshare ESP32-S3-RLCD-4.2：N16R8（16MB Flash / 8MB OPI PSRAM）
board = waveshare-esp32-s3-rlcd-42
framework = arduino
monitor_speed = 115200
; 原生 USB Serial/JTAG 不需要 DTR/RTS 复位，避免 monitor 打开时端口反复重连
monitor_dtr = 0
monitor_rts = 0
; 固件上传波特率提到 921600（ESP32-S3 原生 USB 支持），加快上传
upload_speed = 921600
board_build.partitions = partitions.csv
; 加大 loopTask 栈（loop() 里有多个大数组，默认 8KB 会栈溢出触发 canary panic）
build_unflags = -fexceptions
build_flags =
    -DARDUINO_LOOP_STACK_SIZE=16384
    -fno-exceptions
    ; ESP-SR AFE v1 接口；WakeNet 9 权重从 model 分区加载
    -DCONFIG_AFE_INTERFACE_V1
; ESP-SR AFE + WakeNet 负责 VAD、降噪和 nihaoxiaoxin 唤醒
extra_scripts = pre:scripts/esp_sr_build.py
; 传感器与音频/唤醒词已重构到 src/sensor/ src/audio/ src/ai/ 子目录；
; 旧的 src/audio.cpp 与 src/wake_word.cpp 不再参与编译（保留在磁盘上，
; 确认无误后可自行删除）。
build_src_filter = +<*> -<audio.cpp> -<wake_word.cpp> -<micro_features/> -<mww_model_data.cpp>
; WebSocket 客户端（连接 Mac 服务器上传/接收音频）
; 可选外接 BH1750（板载 SHTC3 直接使用 Wire 协议，无额外依赖）
lib_deps =
    links2004/WebSockets@^2.6.1
    bblanchon/ArduinoJson@^7.0.4
    claws/BH1750@^1.3.0
    olikraus/U8g2@^2.36.5
